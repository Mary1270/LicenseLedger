name: Offline tests

on:
  push:
    paths:
      - "contracts/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
